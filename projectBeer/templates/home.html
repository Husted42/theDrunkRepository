{% extends "layout.html" %}
{% block content %}
<div class="dashboard-container">
  <!-- Top-left: avgByCoun -->
  <div class="chart-box">
    <img src="static/plots/avgByCoun.png" class="chart" alt="Average by Country">
  </div>

  <!-- Top-right: stats -->
  <div class="stats-section">
    <div class="stat-card">
      <div class="stat-number">{{ diffBeer }}</div>
      <div class="stat-label">Different Beers</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">{{ diffBrew }}</div>
      <div class="stat-label">Different Breweries</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">{{ diffCoun }}</div>
      <div class="stat-label">Different Countries</div>
    </div>
  </div>

  <!-- Bottom-left: avgByBrew -->
  <div class="chart-box">
    <img src="static/plots/avgByBrew.png" class="chart" alt="Average by Brewery">
  </div>

  <!-- Bottom-right: donut chart -->
  <div class="donut-chart">
    <img src="static/plots/donoutChart.png" class="donut-img" alt="Donut Chart">
  </div>
</div>
{% endblock content %}
